ekf_filter_node_local:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.25
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odometry and the IMU provide motion estimates independently of ICP.
    # ICP point clouds use this odom TF for assembly, so feeding ICP pose back
    # into this filter would create a correlated feedback loop.
    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    imu0: /imu/data_fusion
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false

    print_diagnostics: true
